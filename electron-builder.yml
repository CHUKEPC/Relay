appId: com.relay.apiclient
productName: Relay
copyright: Copyright © 2026 Relay

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Feature packs ship as plain folders next to the app so a user can see, remove
# or add one without repacking the asar (src/main/features reads them at boot).
extraResources:
  - from: plugins
    to: plugins
    filter:
      - "**/*"

# Keep the sql.js WebAssembly binary as a real on-disk file so emscripten can
# read it at runtime (it's pure-WASM, not a native Node addon).
asarUnpack:
  - "**/node_modules/sql.js/dist/*.wasm"

# No native modules are used (JSON storage), so no rebuild step is required.
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-Setup.${ext}
  # Installer and uninstaller must share one icon: when the Windows installer is
  # built on macOS, electron-builder copies the installer's exe header into the
  # uninstaller, and a different uninstaller icon breaks its NSIS CRC check.
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Shortcuts are created by build/installer.nsh from the user's choice on the
  # "Shortcuts" page, so the stock creation/removal is turned off.
  include: build/installer.nsh
  createDesktopShortcut: false
  createStartMenuShortcut: false
  # installer.nsh defines its page strings for exactly these two languages.
  installerLanguages:
    - en_US
    - ru_RU
  # Ask for the language up front: the choice also becomes the app's UI language
  # (installer.nsh writes it to install-config.json, read by src/main/features).
  multiLanguageInstaller: true
  displayLanguageSelector: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Local/dev builds are unsigned. For distribution configure signing + notarization.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  # The arch is part of the name: x64 and arm64 are built in one run and would
  # otherwise overwrite each other.
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Relay
  synopsis: Isolated desktop client for API testing
